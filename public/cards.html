<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HACSA code cards</title>
<style>
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{font:15px sans-serif;margin:0;padding:12px}
.ctl input,.ctl textarea,.ctl button{width:100%;padding:9px;margin:4px 0;font:inherit}
.ctl button{background:#9b1c2e;color:#fff;border:0;border-radius:5px}
.sheet{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:4mm;width:194mm;height:281mm;margin:10px auto;page-break-after:always;break-after:page}
.card{border:2px solid #0b1f4b;border-radius:3mm;overflow:hidden;display:flex;flex-direction:column;text-align:center;font-family:Georgia,serif;background:#fff}
.top{background:linear-gradient(135deg,#0b1f4b,#9b1c2e);color:#fff;padding:2mm}
.top b{letter-spacing:2px;font-size:15px}.top small{display:block;color:#c9a227;font-style:italic}
.val{background:#c9a227;font:700 14px sans-serif;padding:1.5mm}
.mid{display:flex;align-items:center;justify-content:center;gap:4mm;flex:1}
.code{font:700 17px monospace;letter-spacing:1px;color:#0b1f4b}
.qr,.qr img,.qr canvas{width:24mm!important;height:24mm!important}
.how{font:10px sans-serif;padding:0 3mm 2mm;color:#333}
@page{size:A4;margin:8mm}
@media print{.ctl{display:none}body{padding:0}.sheet{margin:0}}
</style></head><body>
<div class="ctl"><h2>HACSA code cards</h2>
<textarea id=c rows=6 placeholder="Paste codes here, one per line"></textarea>
<input id=v type=number value=10 placeholder="Votes per code">
<input id=u placeholder="Website address">
<button onclick="mk()">Make cards</button><button onclick="print()">Print / Save as PDF</button><p id=m></p></div>
<div id=out></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
document.getElementById('u').value=location.origin;
function mk(){const L=(document.getElementById('c').value.toUpperCase().match(/[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}/g)||[]);
const v=+document.getElementById('v').value||0,raw=document.getElementById('u').value.trim(),url=(/^https?:\/\//.test(raw)?raw:'https://'+raw).replace(/\/+$/,''),disp=url.replace(/^https?:\/\//,''),m=document.getElementById('m');
m.textContent=L.length+' cards';
let h='';
for(let i=0;i<L.length;i+=8){h+='<div class=sheet>'+L.slice(i,i+8).map(c=>`<div class=card><div class=top><b>HACSA AWARDS 2026</b><small>Your Vote. Their Impact.</small></div><div class=val>${v} VOTES · SLE ${v*5}</div><div class=mid><div class=code>${c}</div><div class=qr data-c="${c}"></div></div><div class=how>Scan the QR code, or go to <b>${disp}</b> and type your code. Choose your nominees and cast your votes. You can use the code more than once until its votes run out.</div></div>`).join('')+'</div>'}
document.getElementById('out').innerHTML=h;
if(typeof QRCode!='undefined')document.querySelectorAll('.qr').forEach(e=>new QRCode(e,{text:url+'/#/go?c='+e.dataset.c,width:90,height:90,correctLevel:QRCode.CorrectLevel.M}));
else m.textContent+=' (QR codes could not load: check your internet)'}
</script></body></html>
